<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fred Conciergerie — Prestataires</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #14120E;
    --card: #1E1B15;
    --card-hover: #262219;
    --gold: #C6A15B;
    --gold-dim: #8A6F3E;
    --ivory: #F3EEE3;
    --muted: #9C8F76;
    --border: #332E23;
    --danger: #C0604B;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ivory);font-family:'Inter',sans-serif;-webkit-tap-highlight-color:transparent;}
  .app{max-width:480px;margin:0 auto;padding:0 0 90px;}
  .header{padding:28px 20px 16px;}
  .brand{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:26px;letter-spacing:0.5px;color:var(--gold);margin:0;}
  .sub{font-size:12px;color:var(--muted);margin:4px 0 0;letter-spacing:1.5px;text-transform:uppercase;}
  .search-wrap{padding:0 20px 14px;}
  .search{width:100%;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px;color:var(--ivory);font-size:15px;font-family:'Inter',sans-serif;}
  .search::placeholder{color:var(--muted);}
  .search:focus{outline:none;border-color:var(--gold-dim);}
  .tabs{display:flex;gap:8px;overflow-x:auto;padding:0 20px 16px;scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{flex:0 0 auto;padding:8px 14px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:13px;font-family:'Inter',sans-serif;font-weight:500;white-space:nowrap;cursor:pointer;}
  .tab.active{background:var(--gold);border-color:var(--gold);color:#1A1608;}
  .list{padding:0 20px;display:flex;flex-direction:column;gap:10px;}
  .empty{text-align:center;color:var(--muted);font-size:14px;padding:40px 20px;line-height:1.6;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .card-name{font-size:15px;font-weight:600;margin:0;color:var(--ivory);}
  .card-cat{font-size:11px;color:var(--gold);text-transform:uppercase;letter-spacing:1px;margin:2px 0 0;}
  .stars{font-size:11px;color:var(--gold);white-space:nowrap;flex-shrink:0;}
  .card-spec{font-size:13px;color:var(--muted);margin:8px 0 0;line-height:1.5;}
  .card-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .pill{font-size:11px;color:var(--muted);background:#161310;border:1px solid var(--border);border-radius:6px;padding:3px 8px;}
  .card-actions{display:flex;gap:8px;margin-top:12px;}
  .btn-action{flex:1;text-align:center;padding:9px;border-radius:8px;font-size:13px;font-weight:500;text-decoration:none;border:1px solid var(--border);color:var(--ivory);cursor:pointer;background:transparent;}
  .btn-call{background:#1E241A;border-color:#3A4A2E;color:#B7D19A;}
  .btn-wa{background:#16241F;border-color:#2E4A3C;color:#9AD1B9;}
  .btn-del{flex:0 0 auto;padding:9px 12px;color:var(--danger);border-color:#4A2E28;background:#241816;}
  .fab{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;max-width:440px;width:calc(100% - 40px);background:var(--gold);color:#1A1608;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;}
  .modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);display:flex;align-items:flex-end;z-index:999;}
  .modal{background:var(--card);border:1px solid var(--border);border-radius:16px 16px 0 0;padding:24px;width:100%;max-height:90vh;overflow-y:auto;}
  .modal h3{font-family:'Cormorant Garamond',serif;color:var(--gold);margin:0 0 16px;font-size:22px;font-weight:600;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:11px;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px;}
  .field input, .field select{width:100%;background:#161310;border:1px solid var(--border);border-radius:8px;padding:11px;color:var(--ivory);font-size:14px;font-family:'Inter',sans-serif;}
  .field input:focus, .field select:focus{outline:none;border-color:var(--gold-dim);}
  .modal-actions{display:flex;gap:10px;margin-top:18px;}
  .btn-save{flex:1;background:var(--gold);color:#1A1608;border:none;border-radius:8px;padding:12px;font-weight:600;font-size:14px;cursor:pointer;}
  .btn-cancel{flex:1;background:transparent;color:var(--muted);border:1px solid var(--border);border-radius:8px;padding:12px;font-size:14px;cursor:pointer;}
  .loading{text-align:center;color:var(--muted);font-size:13px;padding:30px;}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="header">
    <p class="brand">Fred Conciergerie</p>
    <p class="sub">Carnet prestataires</p>
  </div>
  <div class="search-wrap">
    <input class="search" id="search" placeholder="Rechercher un nom, une spécialité, une zone..." />
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="list" id="list"><div class="loading">Chargement...</div></div>
</div>
<button class="fab" id="fabAdd">+ Ajouter un prestataire</button>

<script src="app.js"></script>
</body>
</html>
